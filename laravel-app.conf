root /var/www/html/public;
client_max_body_size 50M;
error_log /dev/stdout info;
access_log /dev/stdout;

sub_filter 'http://storage:9000' '';
sub_filter 'http://localhost:9000' '';
sub_filter_once off;
sub_filter_types application/json text/html text/javascript application/javascript;

location /social-media/ {
    proxy_pass http://storage:9000/social-media/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location = /metrics {
    fastcgi_split_path_info ^(.+\.php)(/.*)$;
    include /etc/nginx/fastcgi_params;
    fastcgi_pass php:9000;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
}

location = /manifest.json { try_files $uri =404; }
location = /sw.js { try_files $uri =404; }
location = /offline.html { try_files $uri =404; }

location = /login-gate.php {
    include /etc/nginx/fastcgi_params;
    fastcgi_pass php:9000;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/login-gate.php;
}

location / {
    if ($authgate_ok = 0) {
        return 302 /login-gate.php;
    }
    try_files $uri $uri/ /index.php$is_args$args;
    autoindex off;
    index index.php;
}

location ~ \.php$ {
    set $path_info $fastcgi_path_info;
    fastcgi_index index.php;
    fastcgi_split_path_info ^(.+\.php)(/.*)$;
    include /etc/nginx/fastcgi_params;
    fastcgi_pass php:9000;
    fastcgi_param SCRIPT_FILENAME $request_filename;
    fastcgi_param PHP_VALUE "upload_max_filesize=50M \n post_max_size=50M";
}

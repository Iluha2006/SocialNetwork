name: socialnetwork

# =====================================================================
# PRODUCTION docker-compose
#
# Usage:
#   cp .env.prod.example .env.prod   # fill in real values
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Notes:
#   - Source code is BAKED into the images (no bind mounts).
#   - Migrations run automatically inside the `php` service on startup.
#   - Only nginx (80/443) and reverb (6001) are exposed to the outside.
#   - Postgres / Redis / MinIO are private to the docker network.
# =====================================================================

services:

  # ---------------------------------------------------------------- PHP
  php:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: socialnetwork-php:latest
    container_name: socialnetwork_php
    working_dir: /var/www/html
    env_file:
      - .env.prod
    command: >
      sh -c "
        php artisan migrate --force --no-interaction &&
        php artisan optimize &&
        php-fpm"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep php-fpm || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network
    restart: unless-stopped

  # -------------------------------------------------------------- NGINX
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx.prod
      args:
        VITE_APP_NAME: ${APP_NAME:-SocialNetwork}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-6001}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
    image: socialnetwork-nginx:latest
    container_name: socialnetwork_nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network
    restart: unless-stopped

  # ------------------------------------------------------------ POSTGRES
  postgres:
    image: postgres:16-alpine
    container_name: socialnetwork_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-SocialNetwork}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-SocialNetwork}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  # --------------------------------------------------------------- REDIS
  redis:
    image: redis:7-alpine
    container_name: socialnetwork_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  # ----------------------------------------------------- MINIO (S3 storage)
  storage:
    image: minio/minio:latest
    container_name: socialnetwork_minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - ministorage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: socialnetwork_minio_init
    env_file:
      - .env.prod
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://storage:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing myminio/$${AWS_BUCKET} &&
        mc anonymous set download myminio/$${AWS_BUCKET} &&
        echo 'Bucket initialized successfully'"
    depends_on:
      storage:
        condition: service_healthy
    networks:
      - app-network
    restart: "no"

  # ------------------------------------------------------------- HORIZON
  horizon:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: socialnetwork-php:latest
    container_name: socialnetwork_horizon
    working_dir: /var/www/html
    env_file:
      - .env.prod
    command: php artisan horizon
    depends_on:
      php:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # -------------------------------------------------------------- REVERB
  reverb:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: socialnetwork-php:latest
    container_name: socialnetwork_reverb
    working_dir: /var/www/html
    env_file:
      - .env.prod
    command: php artisan reverb:start --host=0.0.0.0 --port=${REVERB_PORT:-6001}
    ports:
      - "${REVERB_PORT:-6001}:${REVERB_PORT:-6001}"
    depends_on:
      php:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # ----------------------------------------------------------- SCHEDULER
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: socialnetwork-php:latest
    container_name: socialnetwork_scheduler
    working_dir: /var/www/html
    env_file:
      - .env.prod
    command: php artisan schedule:work
    depends_on:
      php:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

